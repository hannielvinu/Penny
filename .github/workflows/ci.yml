name: checks
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PENNY_MOCK: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=penny --cov-report=term-missing
      - run: coverage report --include='*/penny/safety/*,*/penny/agent/guard.py,*/penny/cost/*,*/penny/exec/patch.py' --fail-under=90
      - run: python -m build
      - run: mypy src/penny
        continue-on-error: true
