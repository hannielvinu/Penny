[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "penny-agent"
version = "0.1.0"
description = "The coding agent that tells you the price before it acts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Hanniel Vinu", email = "hannielvinu@gmail.com"}]
dependencies = ["typer==0.24.1", "rich==14.3.3", "pydantic==2.12.5", "pydantic-settings==2.13.1", "PyYAML==6.0.3", "httpx==0.28.1", "python-dotenv==1.2.2", "pathspec==1.0.4", "fastapi==0.135.1", "uvicorn==0.42.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.15.6", "mypy==1.19.1", "build==1.4.0", "beautifulsoup4==4.14.3", "types-PyYAML==6.0.12.20250915"]
tokens = ["tiktoken>=0.9,<1"]

[project.scripts]
penny = "penny.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/penny"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["benchmark/sandbox_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: requires a running Bifrost gateway and credentials"]

[tool.mypy]
ignore_missing_imports = true

