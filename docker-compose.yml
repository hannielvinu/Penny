services:
  bifrost:
    image: maximhq/bifrost:v2.4.0
    ports: ["127.0.0.1:8080:8080"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:?Run python scripts/bootstrap_bifrost.py --prepare first}
      APP_HOST: 0.0.0.0
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      chaos:
        condition: service_healthy
    restart: unless-stopped
  chaos:
    build: .
    command: ["uvicorn", "penny.chaos.proxy:app", "--host", "0.0.0.0", "--port", "8099", "--no-access-log"]
    ports: ["127.0.0.1:8099:8099"]
    environment:
      CHAOS_UPSTREAM_URL: https://api.openai.com
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/admin/mode', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  bifrost-data:
